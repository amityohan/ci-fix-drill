name: CI Pipeline

on:
  push:
    # Match nested branch names such as fix/ci-pipeline-recovery.
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest
    # Jobs run on separate machines, so order the jobs and install dependencies on this runner too.
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
